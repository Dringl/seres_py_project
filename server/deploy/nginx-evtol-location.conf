# eVTOL 后端的 Nginx 反代片段（实际部署为 /etc/nginx/snippets/evtol-locations.conf，
# 在 bq-star.conf 的 443 server 块里与 nongjitong-locations.conf 并列 include）。
#
# 路由约定：外部 https://你的域名/evtol/...  ->  内部 127.0.0.1:8000/...
# 末尾斜杠的 proxy_pass 会把 /evtol/ 前缀剥掉，配合 uvicorn 的 --root-path /evtol，
# Swagger 文档 /evtol/docs、未来的 Web 管理台 /evtol/admin 都能正确工作。

location = /evtol {
    return 302 /evtol/;
}

location ^~ /evtol/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /evtol;

    # app 端为短轮询的 REST，关掉缓冲降低延迟、禁止缓存动态响应
    proxy_buffering off;
    proxy_read_timeout 75s;
    add_header Cache-Control "no-store" always;
}
