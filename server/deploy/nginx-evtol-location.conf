# eVTOL 后端的 Nginx 反代片段。
# 把下面这个 location 块加进【现有农机通那个 server { listen 443 ssl; server_name 你的域名; }】里，
# 与农机通的 /api/v1、/admin 等 location 并列即可。无需新增 server 块、证书或 DNS。
#
# 路由约定：外部 https://你的域名/evtol/...  ->  内部 127.0.0.1:8000/...
# 末尾斜杠的 proxy_pass 会把 /evtol/ 前缀剥掉，配合 uvicorn 的 --root-path /evtol，
# Swagger 文档 /evtol/docs、未来的 Web 管理台 /evtol/admin 都能正确工作。

location /evtol/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /evtol;

    # app 端为短轮询的 REST，关掉缓冲降低延迟；超时给足
    proxy_buffering off;
    proxy_read_timeout 75s;
}
