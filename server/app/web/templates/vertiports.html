{% extends "base.html" %}
{% block title %}停机坪管理{% endblock %}
{% block body %}
<div class="topbar">
  <strong>eVTOL 管理台</strong>
  <a href="{{ request.scope.root_path }}/admin">总览</a>
  <a href="{{ request.scope.root_path }}/admin/vehicles">机队</a>
  <a class="active" href="{{ request.scope.root_path }}/admin/vertiports">停机坪</a>
  <a href="{{ request.scope.root_path }}/admin/orders">订单</a>
  <a href="{{ request.scope.root_path }}/admin/users">用户</a>
  <span class="spacer"></span>
  <form method="post" action="{{ request.scope.root_path }}/admin/logout" style="margin:0"><button class="btn">登出</button></form>
</div>
<div class="wrap">
  <h3>新增停机坪</h3>
  <div class="row-form">
    <input id="np-id" placeholder="ID 如 vp013">
    <input id="np-name" placeholder="名称">
    <input id="np-lat" placeholder="纬度" type="number" step="any">
    <input id="np-lng" placeholder="经度" type="number" step="any">
    <button class="btn" onclick="createVertiport()">新增</button>
  </div>
  <h3>停机坪</h3>
  <table id="vertiports-table"><thead><tr><th>ID</th><th>名称</th><th>占用</th><th>操作</th></tr></thead><tbody></tbody></table>
</div>
{% endblock %}
{% block scripts %}<script src="{{ request.scope.root_path }}/static/admin.js"></script><script>loadVertiports();</script>{% endblock %}
